const tabs=document.getElementById('tabs'),view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(id){
  const s=S.find(x=>x.id===id)||S[0];
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===s.id));
  const cnt={상:0,중:0,하:0};s.rows.forEach(r=>{if(cnt[r[4]]!==undefined)cnt[r[4]]++});
  const max=Math.max(0,...s.units.map(u=>u[1]));
  view.innerHTML=`<section class="sheet" role="tabpanel">
   <h2>${esc(s.name)}</h2>
   <dl class="meta">
    <div><dt>시행일</dt><dd>${s.date}</dd></div>
    <div><dt>범위</dt><dd>${esc(s.range)}</dd></div>
    <div><dt>구성</dt><dd>${esc(s.form)}</dd></div>
    <div><dt>체감 난이도</dt><dd>${s.level}</dd></div>
    <div style="grid-column:1/-1"><dt>정리한 문항</dt><dd>${esc(s.scope)}</dd></div>
   </dl>
   <div><h3>난이도 구성 (정리한 ${s.rows.length}문항)</h3><div class="dist">${['상','중','하'].map(d=>`<span class="chip d-${d}">${d} ${cnt[d]}문항</span>`).join('')}</div></div>
   ${s.units.length?`<div><h3>단원별 비중 · ${s.unitLabel}</h3><div class="units">${s.units.map(u=>`<div class="bar"><span>${esc(u[0])}</span><span class="track"><span class="fill" style="width:${(u[1]/max*100).toFixed(1)}%"></span></span><span class="n">${u[1]}</span></div>`).join('')}</div></div>`:''}
   <div><h3>문항별 분석</h3><div class="tbl"><table>
    <thead><tr><th>번호</th><th>단원</th><th>유형</th><th style="text-align:right">배점</th><th>난이도</th><th>정답</th><th>풀이 핵심</th></tr></thead>
    <tbody>${s.rows.map(r=>`<tr class="${r[4]==='상'?'key':''}"><td class="no">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="pts">${r[3]}</td><td><span class="chip d-${r[4]}">${r[4]}</span></td><td class="ans">${esc(r[5])}</td><td class="core">${esc(r[6])}</td></tr>`).join('')}</tbody>
   </table></div></div>
   <div><h3>핵심 문항</h3><div class="keys">${s.keys.map(k=>`<div class="k"><b>${esc(k[0])}</b><p>${esc(k[1])}</p></div>`).join('')}</div></div>
   <div><h3>기말 대비 포인트</h3><ol class="pt">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
   <p class="note">${esc(s.note)}</p>
  </section>`;
  try{history.replaceState(null,'','#'+s.id)}catch(e){}
}
function renderCommon(id){
  id=id||'common';
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  const C={
   common:`<section class="sheet"><h2>중2 공통으로 보인 출제 소재</h2>
  <ol class="pt">
   <li>평행사변형 + 각의 이등분선 → 이등변삼각형: 중계중, 재현중, 상명중</li>
   <li>외심·내심과 각도: 4개 학교 모두</li>
   <li>평행사변형 넓이 분할(내부의 점, 평행선): 재현중, 상명중</li>
   <li>증명 빈칸·순서: 녹천중, 재현중, 상명중</li>
   <li>변별 문항은 보조선(연장선)으로 숨은 정삼각형·이등변삼각형·합동 삼각형을 찾는 형태가 반복되었습니다.</li>
  </ol>
  <p class="note">학교마다 범위와 문항 구성은 달랐지만, 개념을 새로운 그림과 조건에 적용하는 문항이 네 학교에서 모두 확인되었습니다.</p></section>`,
   common1:`<section class="sheet"><h2>중1 공통으로 보인 출제 소재</h2>
  <ol class="pt">
   <li>기본 도형의 위치 관계(직선·반직선·선분, 꼬인 위치): 재현중, 서울삼육중</li>
   <li>평행선 사이의 각(엇각·외각 결합): 재현중 13번, 서울삼육중 7·17번</li>
   <li>정의를 한 글자까지 묻는 개념 문항: 재현중 6·11번, 서울삼육중 2·3번</li>
   <li>경우를 나눠 세는 문항: 재현중 14·17번, 서울삼육중 14·18번</li>
   <li>범위는 재현중이 정비례·반비례와 통계, 서울삼육중이 작도와 합동·다각형으로 서로 달랐습니다.</li>
  </ol>
  <p class="note">두 학교 모두 후반 번호와 서술형에서 조건을 해석하는 문항이 변별 구간이었습니다.</p></section>`};
  view.innerHTML=C[id];
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
S.forEach(s=>{const b=document.createElement('button');b.textContent=s.tab;b.dataset.id=s.id;b.setAttribute('role','tab');b.onclick=()=>render(s.id);tabs.appendChild(b)});
[['common','중2 공통'],['common1','중1 공통']].forEach(([id,t])=>{const c=document.createElement('button');c.textContent=t;c.dataset.id=id;c.setAttribute('role','tab');c.onclick=()=>renderCommon(id);tabs.appendChild(c)});
const h=(location.hash||'').slice(1);
(h==='common'||h==='common1')?renderCommon(h):render(h||S[0].id);
</script>
