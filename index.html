const tabs=document.getElementById('tabs'),view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(id){

  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===s.id));
  const cnt={상:0,중:0,하:0};s.rows.forEach(r=>{if(cnt[r[4]]!==undefined)cnt[r[4]]++});
  const max=Math.max(0,...s.units.map(u=>u[1]));
  view.innerHTML=`<section class="sheet" role="tabpanel">
   <h2>${esc(s.name)}</h2>
   <dl class="meta">
    <div><dt>시행일</dt><dd>${s.date}</dd></div>
    <div><dt>범위</dt><dd>${esc(s.range)}</dd></div>
    <div><dt>구성</dt><dd>${esc(s.form)}</dd></div>
    <div><dt>체감 난이도</dt><dd>${s.level}</dd></div>
    <div style="grid-column:1/-1"><dt>정리한 문항</dt><dd>${esc(s.scope)}</dd></div>
   </dl>
   <div><h3>난이도 구성 (정리한 ${s.rows.length}문항)</h3><div class="dist">${['상','중','하'].map(d=>`<span class="chip d-${d}">${d} ${cnt[d]}문항</span>`).join('')}</div></div>
   ${s.units.length?`<div><h3>단원별 비중 · ${s.unitLabel}</h3><div class="units">${s.units.map(u=>`<div class="bar"><span>${esc(u[0])}</span><span class="track"><span class="fill" style="width:${(u[1]/max*100).toFixed(1)}%"></span></span><span class="n">${u[1]}</span></div>`).join('')}</div></div>`:''}
   <div><h3>문항별 분석</h3><div class="tbl"><table>
    <thead><tr><th>번호</th><th>단원</th><th>유형</th><th style="text-align:right">배점</th><th>난이도</th><th>정답</th><th>풀이 핵심</th></tr></thead>
    <tbody>${s.rows.map(r=>`<tr class="${r[4]==='상'?'key':''}"><td class="no">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td class="pts">${r[3]}</td><td><span class="chip d-${r[4]}">${r[4]}</span></td><td class="ans">${esc(r[5])}</td><td class="core">${esc(r[6])}</td></tr>`).join('')}</tbody>
   </table></div></div>
   <div><h3>핵심 문항</h3><div class="keys">${s.keys.map(k=>`<div class="k"><b>${esc(k[0])}</b><p>${esc(k[1])}</p></div>`).join('')}</div></div>
   <div><h3>기말 대비 포인트</h3><ol class="pt">${s.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div>
   <p class="note">${esc(s.note)}</p>

}

}
